# SPDX-License-Identifier: Apache-2.0
# Dependabot version updates. Security updates are enabled in the
# repository settings, not here, and ignore the cooldown below.
version: 2
updates:
  # Workflow actions. They are pinned to full commit SHAs with a trailing
  # version comment (supply-chain requirement); Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Let a release settle before adopting it: a compromised release is
    # usually pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Go modules. Dependabot detects the committed vendor/ directory on its
  # own and re-runs `go mod vendor` in every PR, so go.mod, go.sum and
  # vendor/ move together. The spec's bundled(golang(...)) Provides do not:
  # CI fails on that drift (scripts/check-bundled-provides.sh) until the
  # PR gets a commit regenerating them with --fix.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
