# SPDX-License-Identifier: Apache-2.0
name: Build RPM
description: >
  Build the SRPM and binary RPM from the checked-out tree inside an
  EL/Fedora container, rebuilding the SRPM with networking disabled to
  prove the vendored build is fully offline, then apply the rpmlint policy
  check. Shared by ci.yml and release.yml so the recipe exists once.
  Requires a job container started with --privileged (for `unshare -n`).

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        set -euxo pipefail
        . /etc/os-release
        if [ "${ID}" != "fedora" ]; then
          dnf -y install epel-release
        fi
        # glibc-langpack-en: rpmlint 2.x parses the spec under
        # LC_ALL=en_US.UTF-8, and a container without that locale makes
        # bash print setlocale warnings that rpmlint reports as
        # specfile-warning findings.
        dnf -y install rpm-build rpmlint systemd-rpm-macros golang git-core util-linux glibc-langpack-en
        # EL9's own go-rpm-macros predate the current Fedora macros, so
        # EPEL ships them as -epel overlay packages; EL10 and Fedora carry
        # the current macros under the plain names.
        if [ "${ID}" = "fedora" ] || [ "${VERSION_ID%%.*}" -ge 10 ]; then
          dnf -y install go-rpm-macros go-srpm-macros
        else
          dnf -y install go-rpm-macros-epel go-srpm-macros-epel
        fi

    - name: Build source tarball and SRPM
      shell: bash
      run: |
        set -euxo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        spec=packaging/rpm/amd-hsmp-exporter.spec
        version="$(sed -n 's/^Version:[[:space:]]*//p' "$spec" | head -1)"
        # The tarball must carry the name and prefix the expanded Source0
        # expects (a GitHub archive of tag v${version}).
        srcurl="$(rpmspec -P "$spec" | sed -n 's/^Source0:[[:space:]]*//p')"
        base="${srcurl##*/}"
        case "$srcurl" in *'#/'*) base="${srcurl##*#/}" ;; esac
        mkdir -p "$HOME/rpmbuild/SOURCES"
        git archive --format=tar.gz --prefix="amd-hsmp-exporter-${version}/" \
          -o "$HOME/rpmbuild/SOURCES/${base}" HEAD
        rpmbuild -bs "$spec"

    - name: Rebuild binary RPM with networking disabled
      shell: bash
      run: |
        set -euxo pipefail
        # `unshare -n` runs the build in a network namespace with no
        # interfaces, so any attempt to reach the network fails
        # immediately: the committed vendor/ directory must satisfy the
        # entire build. GOPROXY=off inside the spec is belt and braces.
        unshare -n rpmbuild --rebuild "$HOME"/rpmbuild/SRPMS/amd-hsmp-exporter-*.src.rpm

    - name: rpmlint policy check
      shell: bash
      run: |
        set -euxo pipefail
        ./scripts/run-rpmlint.sh packaging/rpm/amd-hsmp-exporter.spec \
          "$HOME"/rpmbuild/SRPMS/amd-hsmp-exporter-*.src.rpm \
          "$HOME"/rpmbuild/RPMS/x86_64/amd-hsmp-exporter-*.rpm

    - name: Stage artifacts
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p rpm-artifacts
        cp "$HOME"/rpmbuild/SRPMS/amd-hsmp-exporter-*.src.rpm \
           "$HOME"/rpmbuild/RPMS/x86_64/amd-hsmp-exporter-*.rpm \
           rpm-artifacts/
